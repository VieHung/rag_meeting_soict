services:
  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: qdrant_server
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1"
      ]
    restart: unless-stopped

  # Optional: Ollama local cho ContextBuilder.
  # Bật bằng: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    restart: unless-stopped

  rag_api:
    build: .
    container_name: rag_api
    ports:
      - "18000:1904"  # host 18000 → container 1904
    volumes:
      - ./app:/app/app
      # Qualcomm SDK (qaicrt/qaiccc/libQAic + wheel qaic) — bắt buộc cho backend qaic.
      - /opt/qti-aic:/opt/qti-aic:ro
      # QPC đã compile (scripts/build_qpc.sh) + HuggingFace cache (chứa tokenizer e5-base).
      - ${QPC_HOST_DIR:-/home/ai/hungtv/qpc}:/opt/qpc:ro
      - ${HF_HOST_DIR:-/home/ai/hungtv/qpc_build/hf_cache}:/opt/hf_cache
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
      # Backend NPU AI080
      - EMBEDDING_BACKEND=qaic
      - EMBEDDING_QPC_PATH=/opt/qpc/e5-base
      - EMBEDDING_MAX_SEQ_LEN=128
      # Nạp native lib + module SDK từ mount (qaicrt/qaiccc .so, QAicApi_pb2)
      - PYTHONPATH=/opt/qti-aic/dev/lib/x86_64:/opt/qti-aic/dev/python
      # apps/ chứa libtorch_cpu.so + libc10.so mà qaiccc cần.
      - LD_LIBRARY_PATH=/opt/qti-aic/dev/lib/x86_64:/opt/qti-aic/dev/lib/x86_64/apps:/opt/qti-aic/lib/x86_64
      # Tokenizer load offline từ cache đã mount
      - HF_HOME=/opt/hf_cache
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    # === Passthrough NPU Qualcomm AI080 (Cloud AI 100 / a080) ===
    devices:
      - /dev/accel/accel0:/dev/accel/accel0
      - /dev/accel/accel1:/dev/accel/accel1
      - /dev/accel/accel2:/dev/accel/accel2
      - /dev/accel/accel3:/dev/accel/accel3
    # gid của group 'qaic' trên host (id -g qaic). Cho phép truy cập /dev/accel*.
    group_add:
      - "999"
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped
